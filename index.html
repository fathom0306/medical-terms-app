<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메디단어 | 의학용어 암기</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#173050;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#0e3e68,#1677a4);color:white;padding:30px 18px 36px}main{max-width:820px;margin:-18px auto 60px;padding:0 16px}.wrap{max-width:820px;margin:auto}h1{font-size:30px;margin:0 0 7px}.sub{opacity:.88;margin:0}.panel{background:white;border:1px solid #e2eaf4;border-radius:18px;padding:22px;box-shadow:0 10px 30px #294f7a0d}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid #d5e1ef;background:white;border-radius:12px;padding:11px 15px;font-weight:700;color:#31516f;cursor:pointer}.tabs button.active{background:#1767a0;color:white;border-color:#1767a0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#667c91;font-size:14px}.big{font-size:31px;font-weight:800;margin:30px 0 12px;overflow-wrap:anywhere}.meaning{font-size:24px;color:#16679d;font-weight:700;margin:14px 0}.btn{cursor:pointer;border:0;background:#1767a0;color:white;font-weight:700;padding:12px 18px;border-radius:11px;font-size:15px}.btn.secondary{background:#edf3fb;color:#225778}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.chip{display:inline-block;background:#e5f4ff;color:#175c86;padding:6px 10px;border-radius:100px;font-size:13px;font-weight:700}.choice{display:block;width:100%;padding:15px;text-align:left;border:1px solid #dae4ee;border-radius:11px;background:#fff;margin:10px 0;font-size:16px;color:#263e54;cursor:pointer}.choice:hover:not(:disabled){border-color:#1978ae;background:#f4faff}.choice.correct{border-color:#159467;background:#e4f8ef}.choice.wrong{border-color:#d75a5a;background:#ffecec}.choice:disabled{cursor:default}.notice{padding:14px;background:#eff7fe;border-radius:10px;margin-top:16px;color:#225578}.search{width:100%;padding:13px;border:1px solid #d6e2ee;border-radius:11px;margin:12px 0 18px;font-size:15px}.entry{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ecf0f4}.entry:last-child{border:0}.term{font-weight:750;color:#1b4a72}.empty{padding:36px;text-align:center;color:#657b8d}.bar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#1a8cbd;transition:width .2s}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.stats span{background:#ffffff20;padding:7px 11px;border-radius:9px;font-size:13px}.footer{margin-top:18px;font-size:12px;color:#7c8da0}button:focus-visible,input:focus-visible{outline:3px solid #6fbdeb;outline-offset:2px}
</style></head><body><header><div class="wrap"><h1>🩺 메디단어</h1><p class="sub">영어 의학용어를 익히고, 퀴즈를 풀고, 틀린 문제만 다시 공부하세요.</p><div class="stats"><span id="count"></span><span id="wrongCount"></span></div></div></header><main><nav class="tabs" aria-label="학습 메뉴"><button data-tab="learn" class="active">📚 단어 학습</button><button data-tab="quiz">📝 퀴즈</button><button data-tab="wrong">📌 오답노트</button><button data-tab="all">🔎 전체 용어</button></nav><section class="panel" id="view" aria-live="polite"></section><p class="footer">학습용 기본 의학용어 자료입니다. 브라우저에 오답이 저장되며, 의료 진단 목적이 아닙니다.</p></main><script>
const terms=[['Hypertension','고혈압'],['Hypotension','저혈압'],['Diabetes mellitus','당뇨병'],['Hyperglycemia','고혈당'],['Hypoglycemia','저혈당'],['Tachycardia','빈맥'],['Bradycardia','서맥'],['Dyspnea','호흡곤란'],['Apnea','무호흡'],['Edema','부종'],['Anemia','빈혈'],['Hemorrhage','출혈'],['Inflammation','염증'],['Infection','감염'],['Pneumonia','폐렴'],['Asthma','천식'],['Myocardial infarction','심근경색'],['Cerebrovascular accident','뇌졸중'],['Fracture','골절'],['Osteoporosis','골다공증'],['Arrhythmia','부정맥'],['Sepsis','패혈증'],['Dehydration','탈수'],['Nausea','오심'],['Vomiting','구토'],['Dizziness','어지럼증'],['Syncope','실신'],['Jaundice','황달'],['Hematuria','혈뇨'],['Dysphagia','연하곤란']];
const key='mediterms_wrong_v1';let wrong=new Set();try{wrong=new Set(JSON.parse(localStorage.getItem(key)||'[]').filter(x=>Number.isInteger(x)&&x>=0&&x<terms.length))}catch{}let tab='learn',learn=0,revealed=false,questions=[],qpos=0,selected=null,score=0,reviewOnly=false;
const $=s=>document.querySelector(s);function store(){try{localStorage.setItem(key,JSON.stringify([...wrong]))}catch{}}function stats(){$('#count').textContent=`전체 ${terms.length}개 용어`;$('#wrongCount').textContent=`오답 ${wrong.size}개`};function htmlEscape(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(x){tab=x;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===x));render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){stats();if(tab==='learn')renderLearn();else if(tab==='quiz')renderQuiz();else if(tab==='wrong')renderWrong();else renderAll()}
function renderLearn(){const t=terms[learn];$('#view').innerHTML=`<div class="flex"><h2>영어 → 한글 학습</h2><span class="chip">${learn+1} / ${terms.length}</span></div><div class="bar"><div class="fill" style="width:${(learn+1)/terms.length*100}%"></div></div><p class="muted">단어를 보고 뜻을 떠올린 뒤, 뜻 보기 버튼을 누르세요.</p><div class="big">${htmlEscape(t[0])}</div>${revealed?`<div class="meaning">${htmlEscape(t[1])}</div>`:'<p class="muted">뜻이 가려져 있습니다.</p>'}<div class="actions"><button class="btn" id="reveal">${revealed?'뜻 숨기기':'뜻 보기'}</button><button class="btn secondary" id="prev">이전</button><button class="btn secondary" id="next">다음</button></div>`;$('#reveal').onclick=()=>{revealed=!revealed;renderLearn()};$('#prev').onclick=()=>{learn=(learn+terms.length-1)%terms.length;revealed=false;renderLearn()};$('#next').onclick=()=>{learn=(learn+1)%terms.length;revealed=false;renderLearn()}}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}function startQuiz(only=false){reviewOnly=only;const ids=only?[...wrong]:terms.map((_,i)=>i);if(!ids.length){setTab('wrong');return}questions=shuffled(ids).slice(0,Math.min(10,ids.length)).map(i=>({id:i,opts:shuffled([i,...shuffled(terms.map((_,j)=>j).filter(j=>j!==i)).slice(0,3)])}));qpos=0;selected=null;score=0;setTab('quiz')}
function renderQuiz(){if(!questions.length){$('#view').innerHTML=`<h2>의학용어 퀴즈</h2><p class="muted">영문 의학용어에 맞는 한국어 뜻을 4지선다로 선택하세요. 틀린 단어는 오답노트에 자동 저장됩니다.</p><button class="btn" id="start">10문제 시작</button>`;$('#start').onclick=()=>startQuiz(false);return}if(qpos>=questions.length){$('#view').innerHTML=`<h2>🎉 퀴즈 완료!</h2><div class="big">${score} / ${questions.length}</div><p>틀린 문제는 오답노트에 저장되었습니다.</p><div class="actions"><button class="btn" id="again">다시 풀기</button><button class="btn secondary" id="wrongTab">오답노트 보기</button></div>`;$('#again').onclick=()=>startQuiz(reviewOnly);$('#wrongTab').onclick=()=>setTab('wrong');return}const q=questions[qpos];$('#view').innerHTML=`<div class="flex"><h2>${reviewOnly?'오답 복습 퀴즈':'의학용어 퀴즈'}</h2><span class="chip">${qpos+1} / ${questions.length}</span></div><div class="bar"><div class="fill" style="width:${qpos/questions.length*100}%"></div></div><p class="muted">다음 영어 의학용어의 한국어 뜻은 무엇인가요?</p><div class="big">${htmlEscape(terms[q.id][0])}</div><div id="choices">${q.opts.map((i,k)=>`<button class="choice" data-choice="${k}" ${selected!==null?'disabled':''}>${k+1}. ${htmlEscape(terms[i][1])}</button>`).join('')}</div>${selected===null?'':`<div class="notice">${selected===q.id?'✅ 정답입니다!':'❌ 오답입니다.'} 정답: <strong>${htmlEscape(terms[q.id][1])}</strong></div><div class="actions"><button class="btn" id="continue">${qpos===questions.length-1?'결과 보기':'다음 문제'}</button></div>`;document.querySelectorAll('[data-choice]').forEach(b=>{const idx=Number(b.dataset.choice);const ans=q.opts[idx];b.classList.toggle('correct',selected!==null&&ans===q.id);b.classList.toggle('wrong',selected!==null&&ans===selected&&ans!==q.id);if(selected===null)b.onclick=()=>{selected=ans;if(ans===q.id){score++;wrong.delete(q.id)}else wrong.add(q.id);store();renderQuiz()}});if(selected!==null)$('#continue').onclick=()=>{qpos++;selected=null;renderQuiz()}}
function renderWrong(){$('#view').innerHTML=`<div class="flex"><h2>📌 오답노트</h2><span class="chip">${wrong.size}개</span></div><p class="muted">퀴즈에서 틀린 용어가 자동으로 모입니다. 복습 퀴즈에서 맞히면 오답노트에서 제거됩니다.</p>${wrong.size?`<div class="actions"><button class="btn" id="review">오답 복습 퀴즈</button><button class="btn secondary" id="clear">오답 전체 지우기</button></div>${[...wrong].map(i=>`<div class="entry"><div><div class="term">${htmlEscape(terms[i][0])}</div><div class="muted">${htmlEscape(terms[i][1])}</div></div><button class="btn secondary" data-remove="${i}">암기 완료</button></div>`).join('')}`:'<div class="empty">🎉 아직 틀린 단어가 없어요!<br>퀴즈를 풀어 보세요.</div>'}`;if(wrong.size){$('#review').onclick=()=>startQuiz(true);$('#clear').onclick=()=>{if(confirm('오답노트를 모두 지울까요?')){wrong.clear();store();render()}};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{wrong.delete(Number(b.dataset.remove));store();render()})}}
function renderAll(){$('#view').innerHTML=`<h2>🔎 전체 의학용어</h2><p class="muted">영어 또는 한국어로 검색하세요.</p><input class="search" id="search" placeholder="예: Hypertension 또는 고혈압" aria-label="의학용어 검색"><div id="results"></div>`;$('#search').oninput=displayResults;displayResults()};function displayResults(){const s=$('#search').value.toLowerCase().trim();const rows=terms.filter(t=>t.join(' ').toLowerCase().includes(s));$('#results').innerHTML=rows.length?rows.map(t=>`<div class="entry"><div class="term">${htmlEscape(t[0])}</div><div>${htmlEscape(t[1])}</div></div>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}render();
</script></body></html>
